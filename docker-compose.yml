services:
  mongo:
    image: mongo:7
    container_name: babayarga_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - sportradaria_net

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: sportradaria_server
    ports:
      - "3017:5000"
    volumes:
      - ./server:/app
      - /app/node_modules
    env_file:
      - ./server/.env
    depends_on:
      - mongo
    networks:
      - sportradaria_net

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: sportradaria_client
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://server:5000
    depends_on:
      - server
    networks:
      - sportradaria_net

volumes:
  mongo_data:

networks:
  sportradaria_net:
    driver: bridge